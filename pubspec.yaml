name: cvd_sim
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.3
  cupertino_icons: ^1.0.8
  go_router: ^7.0.0
  uuid: ^4.3.3
  image_compare_slider: ^2.8.0
  path_provider: ^2.1.0
  path: ^1.9.0
  photo_manager: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

  assets:
    - assets/images/


flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
